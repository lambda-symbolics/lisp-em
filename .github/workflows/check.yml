name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl cargo build-essential curl git tar
      - name: Install Quicklisp and Qlot
        run: |
          curl --fail --location https://beta.quicklisp.org/quicklisp.lisp --output "$RUNNER_TEMP/quicklisp.lisp"
          sbcl --noinform --non-interactive --load "$RUNNER_TEMP/quicklisp.lisp" --eval '(quicklisp-quickstart:install)'
          sbcl --noinform --non-interactive --load "$HOME/quicklisp/setup.lisp" --eval '(ql:quickload :qlot)'
      - name: Install dependencies
        run: ./script/bootstrap
      - name: Run tests and source checks
        run: ./script/check
