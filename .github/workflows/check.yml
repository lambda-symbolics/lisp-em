name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl cargo build-essential curl git tar
      - name: Install Qlot
        run: |
          curl --fail --location https://qlot.tech/installer --output "$RUNNER_TEMP/qlot-installer"
          QLOT_BIN_DIR="$HOME/.local/bin" sh "$RUNNER_TEMP/qlot-installer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install development dependencies
        run: qlot install
      - name: Run tests and source checks
        run: sbcl --noinform --no-userinit --no-sysinit --script check.lisp
